<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task App</title>
</head>

<body>
    <header>
        <nav>
            <button id="home">Home</button>
            <button id="tasks">Tasks</button>
            <button id="settings">Settings</button>
        </nav>
    </header>

    <section class="home">
        <img src="assets/time-management.webp" alt="welcome image">

        <h1>Welcome to Your Personal Task Manager</h1>
        <p>Your journey starts here. Explore and enjoy!</p>
        <button id="startbtn">Get Started</button>
    </section>

    <section class="tasks">
        <h1>To-Do List:</h1>
        <h2>Add your task</h2>
        <form id="taskForm" class="task-form">
            <input type="text" id="task" placeholder="Enter a new task" required>
            <button type="submit" id="addbutton">Add</button>
        </form>
    </section>

    <section class="task-list">
        <h2>Your Tasks</h2>
        <div id="taskList" class="task-list">

        </div>
        <div id="emptyState" class="empty-state">
            <p>No tasks yet. Add your first task!</p>
        </div>

    </section>
    <section class="settings">
        <h1>Profile Settings</h1>

        <h2>Update Profile</h2>
        <form id="Profile" class="update-profile">
            <input type="text" name="name" id="name" placeholder="Enter your name" required>
            <input type="text" name="email" id="email" placeholder="Enter your email" required>
            <button type="submit">Update Profile</button>
        </form>

        <h2>User Info</h2>
        <ul>
            <li>Name: <span id="displayName"> Not set</span></li>
            <li>Email: <span id="displayEmail"> Not set</span> </li>
            <li>Completed Tasks: <span id="displayTaskCount">0</span> </li>



        </ul>

    </section>

    <script src="script.js"></script>


</body>

</html>
